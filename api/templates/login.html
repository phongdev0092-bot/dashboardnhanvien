<!DOCTYPE html>
<html lang="vi" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập Dashboard - Quản lý Nhân sự</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            border: "hsl(var(--border))",
            input: "hsl(var(--input))",
            ring: "hsl(var(--ring))",
            background: "hsl(var(--background))",
            foreground: "hsl(var(--foreground))",
            primary: {
              DEFAULT: "hsl(var(--primary))",
              foreground: "hsl(var(--primary-foreground))",
            },
            secondary: {
              DEFAULT: "hsl(var(--secondary))",
              foreground: "hsl(var(--secondary-foreground))",
            },
            destructive: {
              DEFAULT: "hsl(var(--destructive))",
              foreground: "hsl(var(--destructive-foreground))",
            },
            muted: {
              DEFAULT: "hsl(var(--muted))",
              foreground: "hsl(var(--muted-foreground))",
            },
            accent: {
              DEFAULT: "hsl(var(--accent))",
              foreground: "hsl(var(--accent-foreground))",
            },
            card: {
              DEFAULT: "hsl(var(--card))",
              foreground: "hsl(var(--card-foreground))",
            },
          },
          borderRadius: {
            lg: "var(--radius)",
            md: "calc(var(--radius) - 2px)",
            sm: "calc(var(--radius) - 4px)",
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-background text-foreground antialiased font-sans min-h-screen flex items-center justify-center p-4">

  <!-- Nút chuyển chế độ Sáng/Tối góc trên -->
  <div class="fixed top-4 right-4">
    <button id="theme-toggle-btn" class="p-2 rounded-md border border-border bg-card hover:bg-muted text-foreground transition shadow-sm">
      <i id="theme-icon-sun" data-lucide="sun" class="w-4 h-4 hidden text-amber-500"></i>
      <i id="theme-icon-moon" data-lucide="moon" class="w-4 h-4 text-slate-700 dark:text-slate-200"></i>
    </button>
  </div>

  <!-- Card Đăng nhập kiểu shadcn -->
  <div class="w-full max-w-sm rounded-lg border border-border bg-card p-6 shadow-xl space-y-6">
    <div class="text-center space-y-2">
      <div class="w-12 h-12 rounded-xl bg-primary text-primary-foreground flex items-center justify-center mx-auto shadow-sm">
        <i data-lucide="lock" class="w-6 h-6"></i>
      </div>
      <h1 class="text-xl font-bold tracking-tight text-foreground">Dashboard Nhân viên</h1>
      <p class="text-xs text-muted-foreground">Nhập mật khẩu truy cập để vào hệ thống dashboard</p>
    </div>

    {% if error %}
    <div class="rounded-md border border-destructive/30 bg-destructive/10 p-3 text-xs text-destructive flex items-center gap-2">
      <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="POST" action="/login" class="space-y-4">
      <div class="space-y-1.5">
        <label for="password" class="text-xs font-medium text-foreground">Mật khẩu truy cập</label>
        <div class="relative">
          <input id="password" name="password" type="password" required autofocus
                 placeholder="••••••••"
                 class="w-full px-3 py-2 text-sm rounded-md border border-input bg-background text-foreground focus:outline-none focus:ring-1 focus:ring-ring" />
          <button type="button" onclick="togglePasswordVisibility()" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-muted-foreground hover:text-foreground">
            <i id="pwd-eye-icon" data-lucide="eye" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="w-full py-2 px-4 rounded-md bg-primary text-primary-foreground hover:bg-primary/90 text-xs font-semibold shadow-sm transition flex items-center justify-center gap-1.5">
        <i data-lucide="log-in" class="w-4 h-4"></i>
        <span>Truy cập Dashboard</span>
      </button>
    </form>

    <div class="pt-2 text-center border-t border-border/60">
      <p class="text-[11px] text-muted-foreground">Dữ liệu bảo mật • Kết nối Google Sheets Live</p>
    </div>
  </div>

  <script>
    // Theme toggle
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme === "dark") document.documentElement.classList.add("dark");
    else document.documentElement.classList.remove("dark");

    function updateIcons() {
      const isDark = document.documentElement.classList.contains("dark");
      document.getElementById("theme-icon-sun").classList.toggle("hidden", !isDark);
      document.getElementById("theme-icon-moon").classList.toggle("hidden", isDark);
    }
    updateIcons();

    document.getElementById("theme-toggle-btn").addEventListener("click", () => {
      const isDark = document.documentElement.classList.toggle("dark");
      localStorage.setItem("theme", isDark ? "dark" : "light");
      updateIcons();
    });

    function togglePasswordVisibility() {
      const pwd = document.getElementById("password");
      const icon = document.getElementById("pwd-eye-icon");
      if (pwd.type === "password") {
        pwd.type = "text";
        icon.setAttribute("data-lucide", "eye-off");
      } else {
        pwd.type = "password";
        icon.setAttribute("data-lucide", "eye");
      }
      lucide.createIcons();
    }

    lucide.createIcons();
  </script>
</body>
</html>
